# Render Blueprint — deploys both services on the free plan.
# Render dashboard → New → Blueprint → select this repository.
services:
  # Inference engine (FastAPI + DeFiGuard), built from the root Dockerfile.
  # Free web services sleep after 15 min idle; the first request afterwards
  # waits for the container to start (several minutes on the free CPU).
  - type: web
    name: prithvi28-firewall-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false # prompted for when the Blueprint is created; optional
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"

  # Frontend dashboard — a static site, which never sleeps.
  - type: web
    name: prithvi28-firewall
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Must match the API service's public URL; if Render adds a suffix to
      # the name above, update this and redeploy the site.
      - key: VITE_API_BASE_URL
        value: https://prithvi28-firewall-api.onrender.com
